name: CRA Archive Integrity

on:
  push:
    branches:
      - cra-project-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run archive audit unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify archive and history consistency
        run: python scripts/audit_archive.py --strict
