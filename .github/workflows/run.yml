name: Servo Drive CRA Automated Research

on:
  schedule:
    - cron: '*/5 * * * *' # 5분 주기 실행
  workflow_dispatch:      # 수동 실행 버튼 허용

# 깃허브 액션이 스스로 파일을 수정하고 푸시(Push)할 수 있도록 권한 부여
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x' # 특정 버전을 고정하지 않고 최신 안정 버전을 유연하게 받아와 504 에러 방어

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Run Python automation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py
