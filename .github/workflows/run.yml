name: Servo Drive CRA Automated Research

concurrency:
  group: cra-production-run
  cancel-in-progress: false

on:
  schedule:
    - cron: "17 */3 * * *"  # 3시간마다 UTC 17분 (정각 부하 회피; 한국시간 3시간 간격)
  workflow_dispatch:      # 장애 점검/수동 실행용

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Create immutable pre-run data checkpoint
        id: pre_run_checkpoint
        env:
          BASELINE_REF: safety/data-pre-run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/${BASELINE_REF}"
          echo "Pre-run snapshot: ${BASELINE_REF}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Run Python automation script
        id: run_automation
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set +e
          python -u main.py 2>&1 | tee "$RUNNER_TEMP/cra-automation.log"
          python_exit=${PIPESTATUS[0]}
          echo "exit_code=${python_exit}" >> "$GITHUB_OUTPUT"
          exit "$python_exit"

      - name: Summarize research outcome (not just job success)
        if: ${{ always() && steps.pre_run_checkpoint.outcome == 'success' }}
        env:
          AUTOMATION_EXIT_CODE: ${{ steps.run_automation.outputs.exit_code }}
          AUTOMATION_STEP_OUTCOME: ${{ steps.run_automation.outcome }}
        run: |
          set -euo pipefail
          python scripts/automation_outcome_summary.py "$RUNNER_TEMP/cra-automation.log" \
            --exit-code "${AUTOMATION_EXIT_CODE:-not_run}" \
            --step-outcome "${AUTOMATION_STEP_OUTCOME:-unknown}"

      - name: Verify run and automatically restore invalid data
        id: operational_guard
        if: ${{ always() && steps.pre_run_checkpoint.outcome == 'success' }}
        env:
          BASELINE_REF: safety/data-pre-run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python scripts/operational_guard.py --baseline-ref "${BASELINE_REF}" --branch main --run-id "${GITHUB_RUN_ID}"

      - name: Prune old pre-run checkpoints after successful guard
        if: ${{ always() && steps.operational_guard.outcome == 'success' }}
        env:
          BASELINE_REF: safety/data-pre-run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python scripts/prune_checkpoints.py --keep 30 --protect "refs/heads/${BASELINE_REF}"
