name: Servo Drive CRA Automated Research

concurrency:
  group: cra-production-run
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 */3 * * *"   # 3시간마다 UTC 정각 (한국시간 3시간 간격)
  workflow_dispatch:      # 장애 점검/수동 실행용

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Create immutable pre-run data checkpoint
        env:
          BASELINE_REF: safety/data-pre-run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/${BASELINE_REF}"
          echo "Pre-run snapshot: ${BASELINE_REF}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Run Python automation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py

      - name: Verify run and automatically restore invalid data
        env:
          BASELINE_REF: safety/data-pre-run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python scripts/operational_guard.py --baseline-ref "${BASELINE_REF}" --branch main --run-id "${GITHUB_RUN_ID}"

      - name: Prune old successful pre-run checkpoints
        if: ${{ success() }}
        env:
          BASELINE_REF: safety/data-pre-run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python scripts/prune_checkpoints.py --keep 30 --protect "refs/heads/${BASELINE_REF}"
