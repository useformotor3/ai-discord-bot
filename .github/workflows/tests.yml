name: Isolated Python Tests

on:
  push:
    branches:
      - main
      - cra/official-annex-audit-2026-11-17
      - cra/guidance-claim-mapping-2026-11-17
      - cra/traceability-integrity-2026-11-17
      - cra/m606-annex-item-mapping-2026-11-17
      - cra/product-boundary-evidence-intake-2026-11-17
      - docs/pr39-postmerge-status-2026-11-17
      - cra/integrated-report-independent-audit-2026-11-17
      - cra/requirements-legal-locator-audit-2026-11-17
      - docs/pr37-postmerge-status-2026-11-17
      - docs/pr35-postmerge-status-2026-11-17
      - docs/pr33-postmerge-status-2026-11-17
      - docs/pr30-postmerge-status-sync-2026-11-17
      - docs/pr31-final-dashboard-sync-2026-11-17
      - docs/cra-audit-and-project-control-2026-11-14
      - test/failure-path-fixtures-2026-11-14
      - feature/p1-b2-atomic-persistence-2026-11-16
    paths:
      - ".github/workflows/tests.yml"
      - ".github/workflows/run.yml"
      - "scripts/**"
      - "main.py"
      - "cra_source.py"
      - "cra_claims.py"
      - "cra_pdf_sources.py"
      - "cra_traceability.py"
      - "persistence.py"
      - "tests/**"
      - "AI_RULEBOOK.md"
      - "MASTER_PLAN.md"
      - "PROJECT_STATUS.md"
      - "README.md"
      - "SESSION_LOG.md"
      - "PROJECT_LOG.jsonl"
      - "reports/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/tests.yml"
      - ".github/workflows/run.yml"
      - "main.py"
      - "cra_source.py"
      - "cra_claims.py"
      - "cra_pdf_sources.py"
      - "cra_traceability.py"
      - "persistence.py"
      - "tests/**"
      - "AI_RULEBOOK.md"
      - "MASTER_PLAN.md"
      - "PROJECT_STATUS.md"
      - "README.md"
      - "SESSION_LOG.md"
      - "PROJECT_LOG.jsonl"
      - "reports/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source integrity, compile and pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout approved working branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify exact source blob identities
        shell: bash
        run: |
          set -euo pipefail
          verify_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git hash-object "$path")"
            printf '%s  %s  expected=%s\n' "$actual" "$path" "$expected"
            test "$actual" = "$expected"
          }
          verify_blob "main.py" "16393261529c36f2f0ec914e38002e6795ed9c71"
          verify_blob "cra_source.py" "d86c28c648a6bb206d3187cbdcd2b4ef737a4a98"
          verify_blob "cra_claims.py" "e786d0c6a6059490465ec08c866b529f72b71660"
          verify_blob "cra_pdf_sources.py" "225be9f9a155cfb4f9c8b54f69d7cd2201061333"
          verify_blob "cra_traceability.py" "5eba8374b3e2c4e683e4d9522cf5fae4116bff28"
          verify_blob "tests/test_cra_traceability.py" "89479dc871b5b4e043254d1fba398801a7bb4649"
          verify_blob "reports/CRA_EVD_SEC_TRACEABILITY_CROSSWALK_2026-11-19.csv" "13eb0e00b1fab15f938701ecc54d3befee3a7275"
          verify_blob "reports/CRA_PRODUCT_EVIDENCE_REGISTER_TEMPLATE_2026-11-19.csv" "2d005f15c9163c460c761069dd97f87cc18e176c"
          verify_blob "reports/CRA_M606_ANNEX_I_SERVO_DRIVE_RELEVANCE_2026-11-17.csv" "d7f5a644f9ac1524a3639540278ebcd5581be63a"
          verify_blob "tests/test_cra_pdf_sources.py" "93788b7b74f21d27ff7119a8b7dfe90f2470a0d6"
          verify_blob "persistence.py" "953e2a52b7e6d6e619a4f43766e52d6835df50c8"
          verify_blob "tests/test_p1_b2_atomic_persistence.py" "f78d36164b5ac0d5d5eebe0c5eb5c1214c4e0671"
          verify_blob "tests/conftest.py" "f0d390b8041bcafc126dca0d4bc6486cc5844db2"
          verify_blob "tests/test_main_characterization.py" "e9dc712e4440c651628ae107ef9cc0939cc8228c"
          verify_blob "tests/test_cra_source.py" "746d61d4f5c75c6f49d742d2d27006ba4488a8a9"
          verify_blob "tests/test_cra_claims.py" "d557df937780a266f0cda07660c9de7c477952c0"
          verify_blob "tests/test_mock_infrastructure.py" "05a92ff7ff3a6e4a0374d270770ecc6cf38e0a7f"
          verify_blob "tests/test_p1_reliability.py" "c5e3fbe2e75a6a08703117cb5de34571b5dc10c9"
          verify_blob "tests/test_external_failure_paths.py" "0a84b013b4ffe5f5675092087d40cdc7f1e4bb88"
          verify_blob "scripts/operational_guard.py" "97f34e11a4124ae5a84b444ffa1b42c5d6d42fda"
          verify_blob "tests/test_operational_guard.py" "17d3ac3184e557d4337a753eae6a7a8688d24209"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest requests pypdf

      - name: Compile source and tests
        run: python -m compileall -q main.py cra_source.py cra_claims.py cra_pdf_sources.py cra_traceability.py scripts tests

      - name: Validate CRA cross-matrix traceability
        run: python cra_traceability.py

      - name: Run complete repository test suite
        run: python -m pytest -q

      - name: Live official CRA PDF source read-only canary
        run: python cra_pdf_sources.py --output-dir artifacts/cra-pdf-sources

      - name: Upload CRA official PDF source evidence
        if: always() && hashFiles('artifacts/cra-pdf-sources/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cra-official-pdf-sources-${{ github.sha }}
          path: artifacts/cra-pdf-sources/
          if-no-files-found: error
          retention-days: 7

      - name: Live official CRA source read-only canary
        shell: bash
        run: |
          python - <<'PY'
          from cra_source import (
              SourceUnavailableError,
              fetch_official_cra_source,
              validate_consolidated_cra_corrections,
          )
          from cra_claims import extract_locator_scope

          try:
              source = fetch_official_cra_source()
          except SourceUnavailableError as exc:
              print(f"SKIPPED: temporary official source outage: {exc}")
              raise SystemExit(0)

          print(f"PASS: fetched {len(source['sources'])} allowlisted official sources")
          for item in source["sources"]:
              print(f"- {item['id']}: {item['visible_text_chars']} visible chars; excerpt SHA-256={item['prompt_excerpt_sha256']}")

          validate_consolidated_cra_corrections(source["sources"])
          print("PASS: consolidated CRA text reflects Article 64(10) and Article 67 corrigenda")

          cra = next(item for item in source["sources"] if item["id"] == "CRA-2024-2847-consolidated")
          article_13_8 = extract_locator_scope("Article 13(8)", cra["text"])
          expected_quote = (
              "Manufacturers shall ensure, when placing a product with digital elements on the market, "
              "and for the support period, that vulnerabilities of that product, including its components, "
              "are handled effectively and in accordance with the essential cybersecurity requirements "
              "set out in Part II of Annex I."
          )
          if not article_13_8 or " ".join(expected_quote.split()).casefold() not in " ".join(article_13_8.split()).casefold():
              raise SystemExit("FAIL: live Cellar source Article 13(8) locator/quote verification failed")
          print("PASS: live Article 13(8) paragraph locator and source quote verified")

          implementing = next(
              item for item in source["sources"]
              if item["id"] == "CRA-2025-2392-important-critical-product-descriptions"
          )
          annex_i_10 = extract_locator_scope("Annex I(10)", implementing["text"])
          annex_ii_1 = extract_locator_scope("Annex II(1)", implementing["text"])
          if not annex_i_10 or "physical and virtual network interfaces" not in " ".join(annex_i_10.split()).casefold():
              raise SystemExit("FAIL: live 2025/2392 Annex I category 10 locator failed")
          if not annex_ii_1 or "hardware devices with security boxes" not in " ".join(annex_ii_1.split()).casefold():
              lines = implementing["text"].splitlines()
              for index, line in enumerate(lines):
                  if any(marker in line.casefold() for marker in ("annex ii", "hardware", "security boxes")):
                      print("DEBUG 2025/2392 Annex II source:", " | ".join(lines[max(0, index - 2):min(len(lines), index + 6)]))
              print(f"DEBUG Annex II(1) extracted scope: {annex_ii_1!r}")
              raise SystemExit("FAIL: live 2025/2392 Annex II category 1 locator failed")
          if "core functionality" not in " ".join(implementing["text"].split()).casefold():
              raise SystemExit("FAIL: live 2025/2392 core-functionality recital marker missing")
          print("PASS: live 2025/2392 core-functionality marker and Annex I(10)/Annex II(1) locators verified")
          PY
