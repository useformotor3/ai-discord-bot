name: Isolated Python Tests

on:
  push:
    branches:
      - docs/cra-audit-and-project-control-2026-11-14
      - test/failure-path-fixtures-2026-11-14
      - feature/p1-b2-atomic-persistence-2026-11-16
    paths:
      - ".github/workflows/tests.yml"
      - "main.py"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source integrity, compile and pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout approved working branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify exact source blob identities
        shell: bash
        run: |
          set -euo pipefail
          verify_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git hash-object "$path")"
            printf '%s  %s  expected=%s\n' "$actual" "$path" "$expected"
            test "$actual" = "$expected"
          }
          verify_blob "main.py" "fa8679b758916ba8a446bae41b9ec1b40328da09"
          verify_blob "persistence.py" "a8b63856957674e9eb16043b8a0b7bc4e2cf74ea"
          verify_blob "tests/test_p1_b2_atomic_persistence.py" "1ce8aa9b421d3108ed23f5ceca5b32553ffdde8a"
          verify_blob "tests/conftest.py" "f465fa04f5c30bfa621bc910b2177d678c89fb64"
          verify_blob "tests/test_main_characterization.py" "8019b18696bc9f1eb729feed633ecf2e32f36c04"
          verify_blob "tests/test_mock_infrastructure.py" "05a92ff7ff3a6e4a0374d270770ecc6cf38e0a7f"
          verify_blob "tests/test_p1_reliability.py" "cff881cb0da2724f8810b88ae621909a9e23a6f9"
          verify_blob "tests/test_external_failure_paths.py" "2c5b5c23e66a37a0dc3d1d8b324a023fb5146e13"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile source and tests
        run: python -m compileall -q main.py tests

      - name: Run complete repository test suite
        run: python -m pytest -q
