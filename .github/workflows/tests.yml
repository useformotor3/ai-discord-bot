name: Isolated Python Tests

on:
  push:
    branches:
      - main
      - docs/cra-audit-and-project-control-2026-11-14
      - test/failure-path-fixtures-2026-11-14
      - feature/p1-b2-atomic-persistence-2026-11-16
      - feature/cra-source-grounding-2026-11-17
      - feature/cra-source-grounding-atomic-2026-11-17
    paths:
      - ".github/workflows/tests.yml"
      - ".github/workflows/run.yml"
      - "scripts/**"
      - "main.py"
      - "cra_source.py"
      - "persistence.py"
      - "tests/**"
      - "AI_RULEBOOK.md"
      - "MASTER_PLAN.md"
      - "PROJECT_STATUS.md"
      - "README.md"
      - "SESSION_LOG.md"
      - "PROJECT_LOG.jsonl"
      - "reports/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/tests.yml"
      - "main.py"
      - "persistence.py"
      - "tests/**"
      - "AI_RULEBOOK.md"
      - "MASTER_PLAN.md"
      - "PROJECT_STATUS.md"
      - "README.md"
      - "SESSION_LOG.md"
      - "PROJECT_LOG.jsonl"
      - "reports/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source integrity, compile and pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout approved working branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify exact source blob identities
        shell: bash
        run: |
          set -euo pipefail
          verify_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git hash-object "$path")"
            printf '%s  %s  expected=%s\n' "$actual" "$path" "$expected"
            test "$actual" = "$expected"
          }
          verify_blob "main.py" "d4c955af591d28c1a92f74df087c9fc7f830de7f"
          verify_blob "scripts/cra_source_canary.py" "0f5bd01ea4994874dcc0e6dfb177a740ec56820c"
          verify_blob "cra_source.py" "e12c62efe5c6cb2eec7a9a774f3b1cfdaa36d0ae"
          verify_blob "persistence.py" "953e2a52b7e6d6e619a4f43766e52d6835df50c8"
          verify_blob "tests/test_p1_b2_atomic_persistence.py" "f78d36164b5ac0d5d5eebe0c5eb5c1214c4e0671"
          verify_blob "tests/conftest.py" "d60a789aea13a25253fae105dda56f302f1d1014"
          verify_blob "tests/test_main_characterization.py" "1af2272e97344a5d0f14b7a0b4ad223e5e38c70e"
          verify_blob "tests/test_mock_infrastructure.py" "bb6d5eb379ab83c16ec7cba5f4a8f3fb518dab36"
          verify_blob "tests/test_p1_reliability.py" "c5e3fbe2e75a6a08703117cb5de34571b5dc10c9"
          verify_blob "tests/test_external_failure_paths.py" "5a49d0a6867a272581ca790ef0eee1104f11fc6e"
          verify_blob "scripts/operational_guard.py" "4a8d1bf7509bbbeb2653f9be3761661a9bc02b9e"
          verify_blob "tests/test_operational_guard.py" "2035b598bf77ffd8fe7dc7c19d2915367f0b354d"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile source and tests
        run: python -m compileall -q main.py scripts tests

      - name: Run complete repository test suite
        run: python -m pytest -q
