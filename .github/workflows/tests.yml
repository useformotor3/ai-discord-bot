name: Isolated Python Tests

on:
  push:
    branches:
      - main
      - docs/cra-audit-and-project-control-2026-11-14
      - test/failure-path-fixtures-2026-11-14
      - feature/p1-b2-atomic-persistence-2026-11-16
    paths:
      - ".github/workflows/tests.yml"
      - ".github/workflows/run.yml"
      - "scripts/**"
      - "main.py"
      - "persistence.py"
      - "tests/**"
      - "AI_RULEBOOK.md"
      - "MASTER_PLAN.md"
      - "PROJECT_STATUS.md"
      - "README.md"
      - "SESSION_LOG.md"
      - "PROJECT_LOG.jsonl"
      - "reports/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/tests.yml"
      - ".github/workflows/run.yml"
      - "main.py"
      - "persistence.py"
      - "tests/**"
      - "AI_RULEBOOK.md"
      - "MASTER_PLAN.md"
      - "PROJECT_STATUS.md"
      - "README.md"
      - "SESSION_LOG.md"
      - "PROJECT_LOG.jsonl"
      - "reports/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source integrity, compile and pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout approved working branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify exact source blob identities
        shell: bash
        run: |
          set -euo pipefail
          verify_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git hash-object "$path")"
            printf '%s  %s  expected=%s\n' "$actual" "$path" "$expected"
            test "$actual" = "$expected"
          }
          verify_blob "main.py" "f0b0a34cf6ac0fe28be10d75690969683dd54ce2"
          verify_blob "persistence.py" "953e2a52b7e6d6e619a4f43766e52d6835df50c8"
          verify_blob "tests/test_p1_b2_atomic_persistence.py" "f78d36164b5ac0d5d5eebe0c5eb5c1214c4e0671"
          verify_blob "tests/conftest.py" "f465fa04f5c30bfa621bc910b2177d678c89fb64"
          verify_blob "tests/test_main_characterization.py" "0036e2516812611164b67f162ab2aadc2d280b53"
          verify_blob "tests/test_mock_infrastructure.py" "05a92ff7ff3a6e4a0374d270770ecc6cf38e0a7f"
          verify_blob "tests/test_p1_reliability.py" "c5e3fbe2e75a6a08703117cb5de34571b5dc10c9"
          verify_blob "tests/test_external_failure_paths.py" "2c5b5c23e66a37a0dc3d1d8b324a023fb5146e13"
          verify_blob "scripts/operational_guard.py" "97f34e11a4124ae5a84b444ffa1b42c5d6d42fda"
          verify_blob "tests/test_operational_guard.py" "17d3ac3184e557d4337a753eae6a7a8688d24209"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile source and tests
        run: python -m compileall -q main.py scripts tests

      - name: Run complete repository test suite
        run: python -m pytest -q
